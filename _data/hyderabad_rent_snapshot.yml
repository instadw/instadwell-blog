# Single source of truth for Hyderabad rent figures used across the blog cluster.
# Update this file first, then the posts that quote it.
#
# Snapshot date: 2026-10-19
# Scope: every branded PG and co-living listing (Stanza Living, Zolo, HelloWorld) shown on
#   https://instadwell.com/pg-in-hyderabad pages 1 to 14 on the snapshot date. 82 properties.
# Rent basis: "starting rent" = the lowest listed monthly rate for a property, usually a
#   2, 3 or 4 sharing bed, not a private room. Medians are the middle value of those
#   starting rents (average of the two middle values when the count is even).
# Area assignment: by the locality shown on the listing card. Card text that names two
#   areas is assigned to the more specific one (for example "Hafeezpet Village ... KPHB" -> KPHB).
# Rounding in posts: medians to the nearest Rs. 100 with "about"; lows and highs exact.
# Independent (unbranded) PGs are not included.

