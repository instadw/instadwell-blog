# This file tells Netlify how to build your site and deploy your functions.

[build]
  command = "bundle exec jekyll build"
  
  # The directory that contains your built site.
  publish = "_site"


# Permanent (301) redirects for Hyderabad blog URL changes, October 2026.
# Each old URL is listed with and without the /blog prefix and trailing slash,
# so the rule works whether Netlify serves the blog at its root or under /blog.
# The redirect_from entries in each post remain as a fallback.

[[redirects]]
  from = "/pg-in-madhapur-hyderabad"
  to = "https://instadwell.com/blog/living-in-madhapur-guide"
  status = 301
  force = true

